
name: Generate Neon City

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate neon city
        uses: Haruko386-UnOfficIal/github-city@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          theme: cityNight

      - name: Save city image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f city.svg
          git commit -m "Update neon city" || exit 0
          git push
